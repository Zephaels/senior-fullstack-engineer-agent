name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - run: python scripts/validate_release.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m unittest discover -s source/senior-fullstack-engineer-agent/eval-engine/tests -p 'test_*.py'
      - run: python scripts/qualify_autonomy.py --output qualification-results/autonomy/autonomy-qualification.json
      - run: python scripts/run_release_security_review.py --output qualification-results/security/release-security-report.json
      - run: python -m compileall -q source/senior-fullstack-engineer-agent/scripts scripts
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sfse-release-candidate
          path: dist/
          if-no-files-found: error
