name: Bug report
description: Report a reproducible Skill, plugin, installation, or validation defect
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes: {label: Version}
    validations: {required: true}
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Skill routing, Workflow behavior, Codex plugin, Marketplace, Evaluation, Release scripts, Documentation]
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction steps}
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes: {label: Actual evidence and logs, with secrets removed}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
